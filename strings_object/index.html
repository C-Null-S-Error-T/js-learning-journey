<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ul li a {
            text-decoration: none;
        }
        li {
            list-style: none;
        }
        .ul{
            display: flex;
            justify-content: space-around;
            font-size: 40px;
        }
        .ul li a:hover {
            box-shadow: inset 0 -2px 0 0 #129f59;
            color: #c3b70c;
        }
    </style>
</head>

<body>
    <div class="ul">
        <li><a href="">Home</a></li>
        <li><a href="">About</a></li>
        <li><a href="">Services</a></li>
        <li><a href="">Contact</a></li>
        <li><a href="">Blog</a></li>
    </div>
</body>

</html>
